[theme]
primaryColor = "#00d4ff"
backgroundColor = "#06080d"
secondaryBackgroundColor = "#0c1018"
textColor = "#e8f0f8"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "info"

[server]
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
